[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r5e-verify-py"
version = "0.1.0"
description = "Independent offline Provenance v2 bundle verifier"
requires-python = ">=3.10"
dependencies = ["cryptography>=43"]
license = "Apache-2.0"
readme = "README.md"

[project.scripts]
recurse_verify = "r5e_verify.cli:main"
r5e-verify = "r5e_verify.cli:main"

[tool.setuptools]
packages = ["r5e_verify"]

[tool.setuptools.package-data]
r5e_verify = [
    "provenance_data/schemas/*.json",
    "provenance_data/definitions/*.json",
    "provenance_data/definitions/*/*/*.json",
]

[tool.basedpyright]
include = [
    "r5e_verify/a11.py",
    "r5e_verify/cli.py",
    "r5e_verify/provenance.py",
    "tests/test_provenance_v2.py",
    "tests/test_provenance_v2_a11.py",
]
